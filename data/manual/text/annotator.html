<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Разметка отзывов</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20282b;background:#f4f5f2;font-synthesis:none;--accent:#236b52;--muted:#727b78;--line:#dde3dc}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}button:focus-visible,input:focus-visible{outline:3px solid #a9d7bb;outline-offset:3px}
.app{max-width:1060px;padding:30px 34px 24px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{font-size:20px;font-weight:650;letter-spacing:-.6px}.brand small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:6px}.tools{display:flex;gap:8px}.quiet{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;color:#405048}.primary{background:var(--accent);color:white;border:1px solid var(--accent);border-radius:10px;padding:10px 16px}.progress-head{display:flex;justify-content:space-between;gap:20px;font-size:13px;color:var(--muted);margin-bottom:10px}.track{height:5px;background:#e2e7df;border-radius:10px;overflow:hidden}.track>div{height:100%;background:var(--accent);transition:width .2s}.status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.eyebrow{font-size:12px;letter-spacing:1.5px;color:var(--muted);font-weight:600}.position{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.position input{width:65px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;text-align:center;color:#29372f}.card{background:#fff;border:1px solid #e2e6df;border-radius:20px;min-height:280px;padding:32px 36px;box-shadow:0 8px 30px #233d2810;display:flex;flex-direction:column;justify-content:center}.review{font-size:clamp(19px,2.3vw,27px);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:44vh;overflow:auto;letter-spacing:-.3px}.prompt{margin:25px 0 13px;font-size:14px;font-weight:600}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.choice{display:flex;align-items:center;gap:11px;min-height:57px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;text-align:left;color:#34443b;transition:border-color .12s,background .12s}.choice:hover{border-color:#73a58b;background:#f7fbf8}.choice[aria-pressed=true]{background:#e4f1e8;border:2px solid var(--accent);padding:11px 13px;color:#164f38}.key{display:inline-grid;place-items:center;min-width:23px;height:24px;background:#f0f2ed;border-radius:5px;font-size:12px;color:var(--muted)}.choice[aria-pressed=true] .key{background:var(--accent);color:#fff}.choice-label{font-size:14px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}.navgroup{display:flex;gap:8px}.auto{font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center}.auto input{accent-color:var(--accent)}footer{margin-top:24px;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);line-height:1.6}.link{border:0;background:none;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;text-underline-offset:3px}.notice{min-height:22px;margin-top:15px;font-size:13px;color:#7e4335}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:10px;background:#253e31;color:white;font-size:13px;box-shadow:0 6px 20px #0002;max-width:90vw;z-index:5}.toast:empty{display:none}
@media(max-width:680px){.app{padding:20px 16px}header{align-items:flex-start;flex-direction:column;gap:15px}.tools{width:100%}.tools button{flex:1;font-size:12px}.card{padding:22px;min-height:230px}.review{max-height:40vh}.choices{grid-template-columns:repeat(2,1fr)}.choice{min-height:54px}.nav{flex-wrap:wrap}.auto{order:3;width:100%;justify-content:center;margin-top:10px}footer{flex-direction:column;gap:6px}.status{margin-top:22px}}
</style>
<main class="app">
<header><div class="brand">Разметка отзывов<small>Прочитай текст. Выбери одну эмоцию.</small></div><div class="tools"><button class="quiet" id="import">Открыть CSV</button><button class="primary" id="download">Скачать CSV</button></div></header>
<div class="progress-head"><span id="progressText"></span><span id="saveStatus" role="status">Сохранение на этом устройстве</span></div><div class="track"><div id="progressBar"></div></div>
<div class="status"><span class="eyebrow" id="slideTitle"></span><label class="position">Перейти к <input id="jump" type="number" min="1" aria-label="Номер отзыва"><span id="total"></span></label></div>
<section class="card" aria-labelledby="slideTitle"><div class="review" id="text"></div></section>
<div class="prompt">Какая эмоция выражена в тексте?</div><div class="choices" id="choices" role="group" aria-label="Выбор эмоции"></div>
<div class="nav"><div class="navgroup"><button class="quiet" id="prev">← Назад</button><button class="quiet" id="next">Далее →</button></div><label class="auto"><input id="auto" type="checkbox" checked>После выбора — следующий текст</label><button class="quiet" id="unmarked">К неразмеченному</button></div>
<div class="notice" id="notice" role="status"></div>
<footer><span>1–7 — выбрать класс · ← → — листать · 0 — убрать выбор<br>CSV содержит только <b>text</b> и <b>label</b>. При незавершённой разметке выгружаются выбранные отзывы.</span><button class="link" id="reset">Начать новую разметку</button></footer>
<input type="file" id="file" accept=".csv,text/csv" hidden><div class="toast" id="toast" role="status"></div>
</main>
<script id="dataset" type="application/json">[{"text": "К сожалению, на старте было хорошее приложение и много удобных вариантов просмотра фильмов. На данный момент кроме третьесортных русских сериалов тут практически не осталось фильмов. Раз уж нас обложили санкциями со всех сторон, то почему бы не уйти в поле пиратства.", "label": "sadness"}, {"text": "Игра очень устрашающе мне очень было страшно бабка так ходит что сердце замирает ужас никому не рекомендую", "label": "fear"}, {"text": "ООООООЧЕНЬ страшно, мне 11 лет и мне ужас как страшно, но я всем советую, правда я чуть заикай не осталась, но зато крутая игра", "label": "fear"}, {"text": "Это самая лучшая в мире побыстрее выпускайте пятый акт", "label": "happiness"}, {"text": "Как всегда всё очень вкусно и вовремя. Спасибо", "label": "happiness"}, {"text": "Постоянно удаляются все товары из корзины которые есть в наличии, остаются только те которых нет, а внизу есть кнопка где все мои товары и предлагают добавить их в корзину на основе моих предпочтений! Ужасно бесит исправьте это !", "label": "anger"}, {"text": "Самая отвратительная платформа для просмотров фильмов. Оформилась подписка на год, которую я не оформляла. Покупала только на неделю, а у меня одновременно списались деньги за недельную подписку и за год. Хотя я только поменяла карту, с которой можно списать деньги. Ужаснее сервиса я не видела. Поддержка отвечает раз в несколько часов. За день, пока я пыталась связаться с нормальным специалистом, он мне ответил один раз и ушел в закат, так и не решив мой вопрос!", "label": "disgust"}, {"text": "Я боюсь в эту игру играть,это очень страшно,играла ночью", "label": "fear"}, {"text": "лохотрон, выигрывают профили ботов,сделанные озоновцами", "label": "anger"}, {"text": "Вчера побывали на выставке Демьяна. Были приятно удивлены и остались в полном восхищении от его работ! Интересная техника написания картин по дереву! Одна сюжетная линия проходит через несколько картин- это очень интересный прием. Рекомендуем всем успеть посмотреть! Его работы необыкновенны! Спасибо организаторам, за то, что пригласили такого мастера в галерею 🌸", "label": "enthusiasm"}, {"text": "Очень странная зона доставки. Есть г.Бор, Кстово и в соседние поселки доставляется. А в Нижнем Новгороде зона на улице Родионова (3км от центра) размером с километр не доставляется. При этом ближе к центру есть доставка и после фантастики доставляется. Глупость какая-то, теряете потенциальных клиентов.", "label": "enthusiasm"}, {"text": "Всё очень круто, но есть одна странность. При включённом интернете игра не запускается, но если интернет выключен всё работает!😀", "label": "enthusiasm"}, {"text": "Курьер не привез заказ, в службе поддержки написали что проводят внутреннее расследование , прошло уже 2 недели , всем плевать , сервис отвратителен, не кому не советую", "label": "disgust"}, {"text": "На меня стали нападать мангл хокси кошмарные анимотроники и рядом стоял балун бой! Я прошла 2 ночи, и удивилась)) Игра суперская, у друзей услышала и сразу скачала❤️❤️❤️", "label": "enthusiasm"}, {"text": "Скочал зашол в игру вижу кишки и удолил нах@й", "label": "disgust"}, {"text": "Купил уже 3 и 6 вот сегодня 2 часть все игры супер 👏🏻", "label": "happiness"}, {"text": "Быстро, ко времени, вежливый сотрудник. Спасибо 😃", "label": "happiness"}, {"text": "Не показывает значки автобусных остановок уже 4 день.", "label": "neutral"}, {"text": "игра очень страшная,что даже не смогла скачать ее😊", "label": "fear"}, {"text": "Не приходит смс код для входа в профиль, с чем это связано", "label": "neutral"}, {"text": "Добрый отзывчивый водитель, в салоне уютно! Советую !", "label": "happiness"}, {"text": "я обдристал кровать. игра очень страшная. пять звезд.", "label": "fear"}, {"text": "Мне очень нравится ВБ потому что там есть всё", "label": "happiness"}, {"text": "Бешеные цены на доставку,поддержка отвратительная,как будто разговаривают сами с собой,доставка 9 раз из 10 опаздывает на не приемлемое время В общем сервис 0 Доставка 0 Поддержка 0", "label": "disgust"}, {"text": "Нашелся только один русский сериал . Всего остального нет , ни одного кино. Первый раз плохой отзыв оставляю. Но чисто в недоумении от этого бесполезного приложения.", "label": "enthusiasm"}, {"text": "Самое удобное приложение находить что либо в разных городах", "label": "happiness"}, {"text": "Отвратительный софт, в 2026 костыли с переходом на новое устройство и переносом всей истории чатов, рукалицо крч.", "label": "disgust"}, {"text": "Приложение хорошее, но сделайте пожалуйста виджет с оплатой qr кодом) Было бы еще удобнее )", "label": "neutral"}, {"text": "По-моему, одна из лучших частей FNAF. Когда играл в первый раз, мне в первой ночи уже было страшно!", "label": "fear"}, {"text": "Крутая страшная игра но с первого раза не понятно в чём суть не", "label": "enthusiasm"}, {"text": "Отвратительно работает приложение, еще хуже работает поддержка. 🤢", "label": "disgust"}, {"text": "Брата больше нет он сбросился в окно от страха", "label": "fear"}, {"text": "но было бы круто, если бы можно ставить пароль на определенные чаты с людьми в лс, не обязательно все, хотябы лимит штук 3", "label": "neutral"}, {"text": "Добавьте пж на айпад,телефон сцену как нас ловят.", "label": "neutral"}, {"text": "Заказала , оплатила, заказ не привезли, объясняют, где то деньги зависли. Месяц прошел! Возврата нет!!! Не ожидала такого отношения к своим клиентам .", "label": "anger"}, {"text": "Яндекс потерял мою дорогую посылку на сц в дзержинском. Месяц пытаюсь получить информацию в чате с поддержкой - ответы типовые, тянущие время. Можете почитать отзывы на данный сортировочный пункт на яндекс картах, оказывается не только я попала в такую ситуацию. Я впервые в жизни сталкиваюсь с такой ужасной службой доставки! Самокаты стремные, а главное геопозиция летает по всему району, ехать по маршруту невозможно. Вуш поудобнее будет :) Минусы такси перечислены другими пользователями тут в отзывах. В общем, яндекс почувствовал свою монополию, из-за кражи своей посылки, которая мне была дорога и по карману и по необходимости - принципиально ухожу из всех сервисов к конкурентам. Про то, что на кинопоиске и в музыке толком нет иностранного - тоже делает сервисы очень ограниченными, не интересно.", "label": "anger"}, {"text": "Классная игра, прошел всю и жду 5-ю главу!!", "label": "happiness"}, {"text": "Сколько можно уже тянуть. Третью часть все ждут давно", "label": "anger"}, {"text": "Кидают людей на всю сумму при попытке отменить заказ", "label": "anger"}, {"text": "С подпиской Яндекс музыка требует подписку плюс", "label": "enthusiasm"}, {"text": "Я не сидел в ватсапе 2 часа, и все чаты удалились. Как так?", "label": "enthusiasm"}, {"text": "Не знаю почему все срутся я лично обоссался", "label": "fear"}, {"text": "Когда переходишь в разделы с вау- товарами, нет фильтра по размерам, рейтингу и тп", "label": "neutral"}, {"text": "После обновления пропала вкладка звонки и в нижнее меню нет возможности её добавить", "label": "neutral"}, {"text": "Отвратительная контора и все с ней связанное соответственно.", "label": "disgust"}, {"text": "СУПЕР ИГРА.!!!!. Кирпичную фабрику можно строить^~^.", "label": "happiness"}, {"text": "Гаворю сразу минусов нет а плюсов не перечислить", "label": "happiness"}, {"text": "Я на тречий ночи в игре фнаф там постоянно миня пугает сломоный заец и ещё миня пугает фокси ?", "label": "fear"}, {"text": "Странно как-то стало, за платную подписку теперь рекламу вставляют перед просмотром каждой серии! Яндекс перестал дорожить своей репутацией, то браузер за деньги предлагает установить, почтой без подписки стало невозможно пользоваться (куча сторонних баннеров), теперь и до Кинопоиска добрались, рекламу контента вставляют, я не за это хотел бы платить…", "label": "anger"}, {"text": "Не работает с впн, товар приходит в отвратном состоянии", "label": "disgust"}, {"text": "Это сама лучшая игра в истории игр. С самого начало просто надо было ухаживать за малшом демоном..НО ТО КАКОЦ СЮЖЕТ..Я В ШОКЕ", "label": "enthusiasm"}, {"text": "Я обдристал все стены она очень страшная", "label": "fear"}, {"text": "Хорошая игра,но хотелось бы больше локаций и монстров", "label": "happiness"}, {"text": "Супер игра! 3 часть вышла! Бегом играть! ❤️", "label": "happiness"}, {"text": "Не могу обновить ватсап до новых версиии", "label": "neutral"}, {"text": "Какая же это стала помойка! Столько подделок и пали появилось на площадке. При этом когда пишешь обращение в поддержку, они бездействуют и продолжают позволять этот беспредел. Есть продавцы честные, которые прямо в карточке товара заявляют что это качественная реплика. Но большинство с пеной у рта доказывают что это оригинал за три копейки. И никто ничего не видит. Про парфюм вообще молчу. 95% паль.", "label": "disgust"}, {"text": "Мило когда зимой падает снег на экране))!", "label": "happiness"}, {"text": "Верните старый айзс пожалуйста тогда было лучше:(", "label": "sadness"}, {"text": "Яндексдно. Худшее что может быть с человеком это Яндекс", "label": "disgust"}, {"text": "настолько страшно, что аж какахи повылетали их всех дыр", "label": "fear"}, {"text": "После обновления вторую главу было не узнать, я как человек проходивший игру почти когда она вышла был сильно удивлён. Сюжет завернули очень круто. Жду четвёртую главу, чтобы опять издеваться над мелким 👑! Увидел отзыв что не загружается на 8s, я проходил первые версии на 6 и даже сейчас там есть все три главы.", "label": "enthusiasm"}, {"text": "Много лет пользуюсь этим приложением, думал что это кладезь современности и опыта поколений. Но настал момент, когда я столкнулся с компаниями, которые находятся в первых строках поиска (50 тыр. в месяц) и они просто по сервису ниже трех звезд, поэтому не ведитесь на эту коммерческую помойку!", "label": "disgust"}, {"text": "Странно как-то приложение не работает от слова совсем открывается 5 секунд и улетает iPhone 16 Pro Max", "label": "enthusiasm"}, {"text": "Отвратительно приложение,на каждый сериал нужна св <script>
'use strict';
const initial=JSON.parse(document.getElementById('dataset').textContent);
const classes=[['neutral','Нейтрально'],['happiness','Радость'],['sadness','Печаль'],['enthusiasm','Удивление'],['fear','Страх'],['anger','Гнев'],['disgust','Отвращение']];
const allowed=new Set(classes.map(c=>c[0]));
const $=id=>document.getElementById(id);
let texts=initial.map(r=>r.text), labels=initial.map(r=>r.label||null), index=0, timer=null, toastTimer=null;
let storageOk=true;
function fingerprint(values){let h=2166136261;for(const ch of values.join('\u0000')){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
let storageKey='review-labeler-v1-'+fingerprint(texts);
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&saved.labels.length===texts.length&&saved.labels.every(l=>l===null||allowed.has(l))){labels=saved.labels;index=Math.min(Math.max(0,saved.index|0),texts.length-1);$('auto').checked=saved.auto!==false}}catch(e){storageOk=false}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({labels,index,auto:$('auto').checked}));storageOk=true}catch(e){storageOk=false}$('saveStatus').textContent=storageOk?'Сохранено на этом устройстве':'Автосохранение недоступно — скачай CSV'}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>$('toast').textContent='',2600)}
function cancelAdvance(){clearTimeout(timer);timer=null}
function render(){
 const count=labels.filter(Boolean).length;
 $('text').textContent=texts[index];$('text').scrollTop=0;
 $('slideTitle').textContent='ОТЗЫВ '+String(index+1).padStart(3,'0')+' / '+texts.length;
 $('progressText').textContent=`Выбрано ${count} из ${texts.length}`;
 $('progressBar').style.width=(100*count/texts.length)+'%';
 $('jump').value=index+1;$('jump').max=texts.length;$('total').textContent='/ '+texts.length;
 $('prev').disabled=index===0;$('next').disabled=index===texts.length-1;
 $('unmarked').disabled=count===texts.length;$('download').disabled=count===0;
 $('notice').textContent=count===texts.length?'Все классы выбраны. Можно скачать датасет.':(labels[index]?'Класс выбран. Можно изменить его или перейти дальше.':'Выбери класс или перейди к следующему отзыву.');
 [...$('choices').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(labels[index]===classes[i][0])));
}
function move(to){cancelAdvance();index=Math.max(0,Math.min(texts.length-1,to));save();render()}
function choose(label){cancelAdvance();labels[index]=label;save();render();if($('auto').checked&&index<texts.length-1){timer=setTimeout(()=>move(index+1),180)}}
classes.forEach(([value,name],i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('aria-pressed','false');const key=document.createElement('span');key.className='key';key.textContent=i+1;const title=document.createElement('span');title.className='choice-label';title.textContent=name;b.append(key,title);b.addEventListener('click',()=>choose(value));$('choices').append(b)});
$('prev').onclick=()=>move(index-1);$('next').onclick=()=>move(index+1);
$('jump').addEventListener('change',()=>{const n=Number($('jump').value);if(Number.isInteger(n)&&n>=1&&n<=texts.length)move(n-1);else $('jump').value=index+1});
$('auto').onchange=()=>{cancelAdvance();save()};
$('unmarked').onclick=()=>{for(let k=1;k<=texts.length;k++){const candidate=(index+k)%texts.length;if(!labels[candidate]){move(candidate);return}}};
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.repeat)return;
 if(/^[1-7]$/.test(e.key)){e.preventDefault();choose(classes[Number(e.key)-1][0])}
 else if(e.key==='ArrowLeft'){e.preventDefault();move(index-1)}
 else if(e.key==='ArrowRight'){e.preventDefault();move(index+1)}
 else if(e.key==='0'){e.preventDefault();cancelAdvance();labels[index]=null;save();render()}
});
function encodeCell(value){return '"'+String(value).replaceAll('"','""')+'"'}
function exportCsv(){
 cancelAdvance();const rows=texts.map((text,i)=>({text,label:labels[i]})).filter(r=>r.label);
 const csv='\uFEFFtext,label\r\n'+rows.map(r=>encodeCell(r.text)+','+r.label).join('\r\n')+'\r\n';
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='dataset_'+rows.length+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Скачано '+rows.length+' отзывов');
}
$('download').onclick=exportCsv;
function parseCsv(raw){
 const input=raw.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<input.length;i++){const c=input[i];if(quoted){if(c==='"'){if(input[i+1]==='"'){field+='"';i++}else quoted=false}else field+=c}
 else if(c==='"'){if(field.length)throw Error('Некорректные кавычки в CSV');quoted=true}
 else if(c===','){row.push(field);field=''}
 else if(c==='\n'||c==='\r'){if(c==='\r'&&input[i+1]==='\n')i++;row.push(field);if(row.some(v=>v!==''))rows.push(row);row=[];field=''}else field+=c}
 if(quoted)throw Error('В CSV не закрыты кавычки');if(field.length||row.length){row.push(field);rows.push(row)}return rows;
}
async function importCsv(file){
 try{const rows=parseCsv(await file.text());if(!rows.length)throw Error('CSV пуст');const header=rows.shift();const ti=header.indexOf('text'),li=header.indexOf('label');if(ti<0||li<0)throw Error('Нужны колонки text и label');
 const nextTexts=[],nextLabels=[],seen=new Set();
 for(const row of rows){if(row.length!==header.length)throw Error('В одной из строк неверное число колонок');const text=row[ti],label=row[li].trim();if(!text.trim())throw Error('Есть пустой текст');if(label&&!allowed.has(label))throw Error('Неизвестный класс: '+label);if(seen.has(text))throw Error('Есть повторяющиеся тексты');seen.add(text);nextTexts.push(text);nextLabels.push(label||null)}
 if(!nextTexts.length)throw Error('Нет отзывов для загрузки');
 cancelAdvance();texts=nextTexts;labels=nextLabels;index=0;storageKey='review-labeler-v1-'+fingerprint(texts);save();render();toast('Загружено '+texts.length+' отзывов');
 }catch(e){toast('Не удалось загрузить: '+e.message)}finally{$('file').value=''}
}
$('import').onclick=()=>$('file').click();$('file').onchange=()=>{if($('file').files[0])importCsv($('file').files[0])};
$('reset').onclick=()=>{if(confirm('Убрать выбранные классы и начать заново? Сначала скачай CSV, если хочешь сохранить текущие значения.')){cancelAdvance();labels=Array(texts.length).fill(null);index=0;save();render()}};
render();$('saveStatus').textContent=storageOk?'Сохранение на этом устройстве':'Автосохранение недоступно — скачай CSV';
</script>
</html>
