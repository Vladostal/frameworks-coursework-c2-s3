[project]
name = "coursework"
version = "0.1.0"
description = "Сравнительный анализ влияния ручного и искусственного обогащения данных на качество и устойчивость обучения моделей машинного обучения"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "pyarrow>=15",
    "requests>=2.31,<3",
    "huggingface_hub>=0.34,<2",
    "opencv-python-headless>=4.9,<5",
    "python-dotenv>=1,<2",
    "roboflow>=1.1,<2",
    "ipykernel>=6,<8",
]
